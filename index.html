<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ma Muscu</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ma Muscu">
<meta name="theme-color" content="#e8590c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f2f2f7;--card:#fff;--text:#14141a;--muted:#70707c;--line:#e4e4ea;--in:#f0f0f5;--sh:0 2px 10px rgba(0,0,0,.06)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e0e12;--card:#1b1b21;--text:#f3f3f7;--muted:#9a9aa8;--line:#2b2b33;--in:#25252d;--sh:none}}
:root[data-theme="dark"]{--bg:#0e0e12;--card:#1b1b21;--text:#f3f3f7;--muted:#9a9aa8;--line:#2b2b33;--in:#25252d;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding:18px 16px 110px}
button{font:inherit;color:inherit;cursor:pointer}
h1{font-size:32px;letter-spacing:-.5px;margin:10px 0 2px}
.sub{color:var(--muted);margin:0 0 22px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.lnk{background:none;border:0;color:var(--c,#e8590c);font-size:17px;padding:8px 0;font-weight:600}
.card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:0;border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--sh);position:relative;overflow:hidden}
.card:active{transform:scale(.98)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.ico{width:56px;height:56px;border-radius:18px;background:color-mix(in srgb,var(--c) 18%,transparent);display:grid;place-items:center;font-size:28px;flex:none}
.card .n{font-weight:700;font-size:19px}
.card .d{color:var(--muted);font-size:14px;margin-top:3px}
.card .go{margin-left:auto;color:var(--muted);font-size:22px}
.card.add{justify-content:center;color:var(--muted);background:transparent;border:2px dashed var(--line);box-shadow:none;font-weight:600}
.card.add::before{display:none}
.hero{display:flex;align-items:center;gap:12px;margin:6px 0 4px}
.hero .ico{width:48px;height:48px;font-size:24px;border-radius:16px}
.hero h1{margin:0;font-size:28px}
.prog{height:8px;background:var(--line);border-radius:4px;margin:12px 0 4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c);border-radius:4px;transition:width .25s}
.cnt{color:var(--muted);font-size:14px;margin:0 0 16px}
.ex{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--sh);transition:opacity .2s}
.ex.ok{opacity:.5}
.ex .t{display:flex;gap:12px;align-items:center}
.num{width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.ex h3{margin:0;font-size:17px}
.ex .m{color:var(--muted);font-size:14px;margin-top:2px}
.sets{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.set{width:52px;height:52px;border-radius:50%;border:2.5px solid var(--c);background:none;color:var(--c);font-weight:700;font-size:18px}
.set.on{background:var(--c);color:#fff}
.set:active{transform:scale(.92)}
.btn{display:block;width:100%;padding:15px;border-radius:16px;border:0;background:var(--c);color:#fff;font-weight:700;font-size:17px;margin-top:10px}
.btn.alt{background:var(--card);color:var(--text);box-shadow:var(--sh)}
.btn.red{background:transparent;color:#e5484d;box-shadow:none}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
input{width:100%;padding:13px;border-radius:12px;border:2px solid transparent;background:var(--in);color:var(--text);font:inherit;font-size:16px}
input:focus{outline:0;border-color:var(--c)}
.row2{display:flex;gap:10px}
.row2 .em{width:80px;text-align:center;font-size:24px}
.sw{display:flex;gap:12px;margin-top:4px}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;background:var(--k)}
.sw button.on{border-color:var(--text)}
.erow{background:var(--card);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:var(--sh)}
.erow .r1{display:flex;gap:8px;margin-bottom:8px}
.erow .r2{display:flex;gap:8px;align-items:center}
.erow .in-s{width:70px;text-align:center}.erow .in-r{flex:1}
.mini{width:42px;height:42px;border-radius:12px;border:0;background:var(--in);font-size:16px;flex:none}
.mini.x{color:#e5484d}
#timer{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:#16161c;color:#fff;border-radius:18px;padding:16px;text-align:center;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.35);display:none;border:0;width:calc(100% - 32px)}
#timer.show{display:block}
</style>
</head>
<body>
<div id="app"></div>
<button id="timer"></button>
<script>
const COLORS=['#e8590c','#2f80ed','#12a150','#9b51e0','#e11d74','#0891b2'];
const DEF={sessions:[
 {id:'a',name:'Haut A · Pecs & Dos',emoji:'💪',color:COLORS[0],ex:[
  {n:'Développé couché',s:4,r:'6-8'},{n:'Tractions (ou tirage vertical)',s:4,r:'6-10'},
  {n:'Développé incliné haltères',s:3,r:'8-12'},{n:'Rowing barre / haltère',s:3,r:'8-10'},
  {n:'Élévations latérales',s:3,r:'12-15'},{n:'Curl biceps',s:2,r:'10-12'},{n:'Extension triceps poulie',s:2,r:'10-12'}]},
 {id:'b',name:'Haut B · Épaules & Bras',emoji:'🔥',color:COLORS[1],ex:[
  {n:'Développé militaire haltères',s:4,r:'6-10'},{n:'Tirage horizontal',s:4,r:'8-12'},
  {n:'Dips ou pompes lestées',s:3,r:'8-12'},{n:'Écartés poulie',s:3,r:'12-15'},
  {n:'Oiseau / face pull',s:3,r:'15'},{n:'Curl marteau',s:3,r:'10-12'},{n:'Barre au front',s:3,r:'10-12'}]}
],prog:{}};
let D=null;try{D=JSON.parse(localStorage.getItem('muscu_v2'))}catch(e){}
if(!D||!D.sessions)D=JSON.parse(JSON.stringify(DEF));
const app=document.getElementById('app');
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=()=>{try{localStorage.setItem('muscu_v2',JSON.stringify(D))}catch(e){}};
const sess=id=>D.sessions.find(s=>s.id===id);
const nSets=s=>s.ex.reduce((a,x)=>a+(+x.s||0),0);
const nDone=s=>Object.values(D.prog[s.id]||{}).reduce((a,v)=>a+v.length,0);
let view={n:'home'},draft=null;

function homeV(){
 return `<h1>Ma Muscu</h1><p class="sub">Quelle séance aujourd’hui ?</p>`+
 D.sessions.map(s=>{const d=nDone(s);return `<button class="card" style="--c:${s.color}" data-a="go" data-id="${s.id}">
  <div class="ico">${esc(s.emoji)}</div><div><div class="n">${esc(s.name)}</div>
  <div class="d">${s.ex.length} exercices · ${nSets(s)} séries${d?` · ${d} faites`:''}</div></div><span class="go">›</span></button>`}).join('')+
 `<button class="card add" data-a="new">＋ Nouvelle séance</button>`;
}
function sessionV(){
 const s=sess(view.id),p=D.prog[s.id]||{},t=nSets(s),d=nDone(s);
 return `<div class="bar" style="--c:${s.color}"><button class="lnk" data-a="home">‹ Séances</button><button class="lnk" data-a="edit">✎ Modifier</button></div>
 <div style="--c:${s.color}"><div class="hero"><div class="ico">${esc(s.emoji)}</div><h1>${esc(s.name)}</h1></div>
 <div class="prog"><i style="width:${t?100*d/t:0}%"></i></div><p class="cnt">${d} / ${t} séries faites</p>`+
 s.ex.map((x,i)=>{const dn=p[i]||[];return `<div class="ex ${dn.length>=x.s?'ok':''}"><div class="t"><div class="num">${i+1}</div>
  <div><h3>${esc(x.n)}</h3><div class="m">${x.s} séries × ${esc(x.r)} reps</div></div></div><div class="sets">`+
  Array.from({length:+x.s||0},(_,k)=>`<button class="set ${dn.includes(k)?'on':''}" data-a="set" data-i="${i}" data-k="${k}">${k+1}</button>`).join('')+`</div></div>`}).join('')+
 `<button class="btn alt" data-a="reset">Réinitialiser la séance</button></div>`;
}
function editV(){
 const s=draft;
 return `<div style="--c:${s.color}"><div class="bar"><button class="lnk" data-a="cancel">Annuler</button><button class="lnk" data-a="save">Enregistrer</button></div>
 <h1>${s.isNew?'Nouvelle séance':'Modifier'}</h1>
 <label>Nom & emoji</label><div class="row2"><input class="em" id="em" value="${esc(s.emoji)}" maxlength="4"><input id="nm" value="${esc(s.name)}" placeholder="Ex : Pecs, Dos…"></div>
 <label>Couleur</label><div class="sw">${COLORS.map(c=>`<button style="--k:${c}" class="${c===s.color?'on':''}" data-a="color" data-c="${c}"></button>`).join('')}</div>
 <label>Exercices</label>`+
 s.ex.map((x,i)=>`<div class="erow"><div class="r1"><input class="in-n" value="${esc(x.n)}" placeholder="Nom de l’exercice"></div>
  <div class="r2"><input class="in-s" type="number" inputmode="numeric" min="1" max="12" value="${x.s}" aria-label="Séries"><input class="in-r" value="${esc(x.r)}" placeholder="Reps (ex : 8-10)">
  <button class="mini" data-a="up" data-i="${i}">↑</button><button class="mini" data-a="dn" data-i="${i}">↓</button><button class="mini x" data-a="rm" data-i="${i}">✕</button></div></div>`).join('')+
 `<button class="btn alt" data-a="addex">＋ Ajouter un exercice</button>
 <button class="btn" data-a="save">Enregistrer la séance</button>
 ${s.isNew?'':`<button class="btn red" data-a="del">${s.confirmDel?'Touche encore pour supprimer':'Supprimer la séance'}</button>`}</div>`;
}
function render(keep){
 const y=scrollY;
 app.innerHTML=view.n==='home'?homeV():view.n==='session'?sessionV():editV();
 scrollTo(0,keep?y:0);
}
function sync(){
 draft.name=$('#nm').value;draft.emoji=$('#em').value||'💪';
 draft.ex=[...document.querySelectorAll('.erow')].map(r=>({n:r.querySelector('.in-n').value,s:Math.max(1,Math.min(12,+r.querySelector('.in-s').value||1)),r:r.querySelector('.in-r').value}));
}
let tmr=null,left=0;
function showT(){const t=$('#timer');t.classList.add('show');t.textContent='⏱ Repos '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0')+' · toucher pour fermer'}
function rest(){left=90;showT();clearInterval(tmr);tmr=setInterval(()=>{left--;if(left<=0){stopT();try{navigator.vibrate&&navigator.vibrate(400)}catch(e){}}else showT()},1000)}
function stopT(){clearInterval(tmr);$('#timer').classList.remove('show')}
$('#timer').onclick=stopT;

const act={
 go:b=>{view={n:'session',id:b.dataset.id};render()},
 home:()=>{view={n:'home'};render()},
 edit:()=>{draft=JSON.parse(JSON.stringify(sess(view.id)));view.n='edit';render()},
 new:()=>{draft={id:'s'+Date.now(),name:'',emoji:'💪',color:COLORS[D.sessions.length%COLORS.length],ex:[{n:'',s:3,r:'10'}],isNew:true};view={n:'edit'};render()},
 set:b=>{const s=sess(view.id),i=b.dataset.i,k=+b.dataset.k;const p=D.prog[s.id]=D.prog[s.id]||{};const d=p[i]=p[i]||[];
  const j=d.indexOf(k);if(j>-1)d.splice(j,1);else{d.push(k);rest()}save();render(true)},
 reset:()=>{delete D.prog[view.id];save();stopT();render(true)},
 color:b=>{sync();draft.color=b.dataset.c;render(true)},
 addex:()=>{sync();draft.ex.push({n:'',s:3,r:'10'});render(true)},
 rm:b=>{sync();draft.ex.splice(+b.dataset.i,1);render(true)},
 up:b=>{sync();const i=+b.dataset.i;if(i>0)[draft.ex[i-1],draft.ex[i]]=[draft.ex[i],draft.ex[i-1]];render(true)},
 dn:b=>{sync();const i=+b.dataset.i;if(i<draft.ex.length-1)[draft.ex[i+1],draft.ex[i]]=[draft.ex[i],draft.ex[i+1]];render(true)},
 save:()=>{sync();const isNew=draft.isNew;delete draft.isNew;delete draft.confirmDel;
  draft.name=draft.name.trim()||'Séance';draft.ex=draft.ex.filter(x=>x.n.trim());
  const j=D.sessions.findIndex(s=>s.id===draft.id);if(j>-1)D.sessions[j]=draft;else D.sessions.push(draft);
  delete D.prog[draft.id];save();view={n:'session',id:draft.id};render()},
 cancel:()=>{if(draft.isNew)view={n:'home'};else view={n:'session',id:draft.id};render()},
 del:()=>{if(!draft.confirmDel){sync();draft.confirmDel=true;render(true);return}
  D.sessions=D.sessions.filter(s=>s.id!==draft.id);delete D.prog[draft.id];save();view={n:'home'};render()}
};
app.onclick=e=>{const b=e.target.closest('[data-a]');if(b&&act[b.dataset.a])act[b.dataset.a](b)};
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
